# PlanToTour on Netlify: drag this folder onto the Deploys tab (no build step).

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/pyodide/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/pyodide/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
